<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>架构图</title>
<!-- ARCHMAP:CSS -->
</head>
<body>
<main class="main" id="main">
  <aside class="explorer" id="explorer" aria-label="浏览项目">
    <div class="explorer-head"><p class="eyebrow">项目索引</p><h2>浏览项目</h2><p>选择一个指定工作项，查看它在代码中的位置。</p></div>
    <div class="explorer-tabs" id="explorer-tabs" role="group" aria-label="浏览方式"></div>
    <div class="explorer-list" id="overlays" aria-label="项目索引"></div>
    <div class="explorer-foot">本地生成的地图。特性状态以规格文件为准。</div>
  </aside>
  <section class="stage" aria-labelledby="level-title">
    <div class="stage-top-bar">
      <nav class="crumbs" id="crumbs" aria-label="层级"></nav>
      <button type="button" id="stage-chat-btn" class="tbtn stage-chat-btn" title="切换到对话审查">对话</button>
    </div>
    <div class="level-head" id="level-head"></div>
    <details class="map-key" open><summary>图例 <span>连接与来源覆盖</span></summary><div class="legend" id="legend"></div></details>
    <div class="selection-bar" id="selection-bar"><p class="ov-note" id="overlay-note" aria-live="polite"></p></div>
    <div class="viewport" id="viewport">
      <div class="sizer" id="sizer">
        <div class="canvas" id="canvas">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
          <div class="blocks" id="blocks" role="group" aria-label="代码位置"></div>
        </div>
      </div>
    </div>
    <div class="stage-features" id="stage-features">
      <div class="sf-header">特性区块 · 悬停或选中时高亮关联链路</div>
      <div class="sf-grid" id="sf-grid"></div>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="详情">
    <div class="panel-top-bar">
      <button type="button" id="panel-toggle-btn" class="panel-collapse-btn" title="收起详情栏" aria-label="收起详情栏">›</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</main>
<section class="drawer" id="drawer" aria-label="诊断" hidden></section>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="announcer" id="announcer" role="status" aria-live="polite"></div>
<noscript><p class="noscript">此地图需要启用 JavaScript。</p></noscript>
<span hidden>地图说明 详情 架构图</span>
<!-- ARCHMAP:DATA -->
<!-- ARCHMAP:JS -->
</body>
</html>
